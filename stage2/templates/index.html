<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BNG Dataset Generator</title>
  <link rel="stylesheet" href="/static/app.css?v=5">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand">BNG <span>DATASETS</span></div>
      <button class="new-chat" type="button" onclick="location.reload()">＋ New request</button>
      <nav aria-label="Workspace navigation">
        <p>RECENT</p>
        <a class="active" href="#">Dataset generation</a>
        <a href="#">Experiment history</a>
        <a href="#">Testbed status</a>
      </nav>
      <section class="dataset-nav" aria-label="Generated datasets">
        <p>DATASETS</p>
        <div id="dataset-history" class="dataset-history">
          <span class="history-empty">No completed datasets yet</span>
        </div>
      </section>
      <div class="sidebar-footer">osVBNG testbed<br><small>Connected workspace</small></div>
    </aside>
    <section class="workspace">
      <header>
        <div class="window-dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="page-title">Dataset workspace <span>Describe the BNG data you need</span></div>
        <span id="active-badge" class="active-badge">Ready</span>
      </header>
      <section id="messages" aria-live="polite">
        <article class="assistant">Describe the BNG dataset you need in plain English.</article>
      </section>
      <form id="chat-form">
        <input id="message" autocomplete="off" placeholder="Describe the BNG dataset you need in plain English." required>
        <button>Send</button>
      </form>
    </section>
  </main>
  <script src="/static/app.js?v=5"></script>
</body>
</html>
