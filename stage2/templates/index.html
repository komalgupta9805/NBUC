<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BNG Dataset Generator</title>
  <link rel="stylesheet" href="/static/app.css?v=6">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand">BNG <span>DATASETS</span></div>
      <button id="new-request" class="new-chat" type="button">＋ New request</button>
      <nav aria-label="Workspace navigation">
        <p>WORKSPACE</p>
        <button class="workspace-nav active" type="button" data-view="generation">Dataset generation</button>
        <button class="workspace-nav" type="button" data-view="experiments">Experiment history</button>
        <button class="workspace-nav" type="button" data-view="testbed">Testbed status</button>
        <button id="recipes-toggle" class="workspace-nav" type="button" data-view="recipes" aria-expanded="false" aria-controls="recipe-selector">Recipes</button>
        <div id="recipe-selector" class="recipe-selector" role="menu" aria-label="Select a recipe" hidden>
          <span class="recipe-selector-loading">Loading recipes…</span>
        </div>
      </nav>
      <section class="dataset-nav" aria-label="Generated datasets">
        <p>DATASETS</p>
        <div id="dataset-history" class="dataset-history">
          <span class="history-empty">No completed datasets yet</span>
        </div>
      </section>
      <div class="sidebar-footer">osVBNG testbed<br><small id="connection-status">Checking workspace status…</small></div>
    </aside>
    <section class="workspace">
      <header>
        <div class="window-dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="page-title">Dataset workspace <span>Describe the BNG data you need</span></div>
        <span id="active-badge" class="active-badge">Ready</span>
      </header>
      <section id="messages" aria-live="polite">
        <article class="assistant">Describe the BNG dataset you need in plain English.</article>
      </section>
      <form id="chat-form">
        <input id="message" autocomplete="off" placeholder="Describe the BNG dataset you need in plain English." required>
        <button>Send</button>
      </form>
    </section>
  </main>
  <script src="/static/app.js?v=14"></script>
</body>
</html>
